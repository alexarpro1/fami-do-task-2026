// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.10.1'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Build-Ausgabe der Capacitor-Module aus node_modules in android/build verlagern,
    // damit unter Windows keine "Unable to delete directory" in node_modules entsteht.
    afterEvaluate { project ->
        if (project.path.startsWith(':capacitor-')) {
            project.buildDir = file("${rootProject.projectDir}/build/subs/${project.name}")
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
